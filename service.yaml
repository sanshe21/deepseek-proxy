apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: deepseek-proxy
  namespace: default
spec:
  name: deepseek-proxy
  image: ghcr.io/sanshe21/deepseek-proxy:latest
  imagePullPolicy: Always
  ports:
    - port: 3001
      protocol: TCP
      expose: true
  envs:
    - key: DEEPSEEK_API_KEY
      value: "sk-3cbec076a0f54ff995d7fb75e86275da"
    - key: VISUAL_API_KEY
      value: "06e2b5ad5cf647d0aaae8d045cde9ccf.5M0Nq2Q1w5jxNELf"
    - key: VISUAL_MODEL
      value: "glm-4.6v-flash"
    - key: VISUAL_BASE_URL
      value: "https://open.bigmodel.cn/api/paas/v4"
    - key: DEEPSEEK_MODEL
      value: "deepseek-chat"
    - key: DEEPSEEK_BASE_URL
      value: "https://api.deepseek.com"
    - key: PORT
      value: "3001"
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
